name: Publish to npm

# Trigger: push a tag in mayor.minor.patch format, e.g. 1.0.0
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    name: Verify & Publish
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not mayor.minor.patch (example: 1.0.0)."
            exit 1
          fi
          echo "Publishing version: $tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # This package is zero-dependency ESM with no compile step,
      # so tests act as the build gate.
      - name: Build (run tests)
        run: npm test

      - name: Sync package.json version with tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        # Accepts either secret name so it works out of the box.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::npm token not found. Add a repository secret named NPM_TOKEN. If the secret lives in an Environment, declare 'environment: <name>' on this job."
            exit 1
          fi
          npm publish --access public
